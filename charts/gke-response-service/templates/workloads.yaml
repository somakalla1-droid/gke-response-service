apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccount" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- if .Values.secretManager.enabled }}
{{- if not .Values.secretManager.projectNumber }}
{{- fail "secretManager.projectNumber is required when secretManager.enabled is true" }}
{{- end }}
{{- if not .Values.secretManager.secretName }}
{{- fail "secretManager.secretName is required when secretManager.enabled is true" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "app.secretProviderClass" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secretManager.projectNumber }}/secrets/{{ .Values.secretManager.secretName }}/versions/latest"
        fileName: "{{ .Values.secretManager.fileName }}"
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.configMap" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  CLUSTER_NAME: {{ .Values.config.clusterName | quote }}
  REGION: {{ .Values.config.region | quote }}
  RESPONSE_MESSAGE: {{ .Values.config.responseMessage | quote }}
---
{{- if .Values.secret.create }}
{{- if not .Values.secret.stringData }}
{{- fail "secret.stringData must contain at least one value when secret.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.secret" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: {{ include "app.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "app.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.serviceAccount" . }}
      {{- if .Values.secretManager.enabled }}
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: application
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef:
                name: {{ include "app.configMap" . }}
            {{- if or .Values.secret.create .Values.secret.existingSecret }}
            - secretRef:
                name: {{ include "app.secret" . }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.secretManager.enabled }}
          volumeMounts:
            - name: gsm-secrets
              mountPath: {{ .Values.secretManager.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- if .Values.secretManager.enabled }}
      volumes:
        - name: gsm-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "app.secretProviderClass" . }}
      {{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "app.fullname" . }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "app.fullname" . }}}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "app.fullname" . }}}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "app.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
