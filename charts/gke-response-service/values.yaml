replicaCount: 2
image:
  repository: us-central1-docker.pkg.dev/gke-sre-assesment/gke-apps/gke-response-service
  tag: latest
  pullPolicy: IfNotPresent
serviceAccount: {name: ""}
service: {type: ClusterIP, port: 80}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
autoscaling: {minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70}
podDisruptionBudget: {minAvailable: 1}
environment: {clusterName: unknown, region: unknown, responseMessage: response-service-ready}
