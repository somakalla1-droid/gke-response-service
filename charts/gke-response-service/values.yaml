replicaCount: 2
image:
  repository: us-central1-docker.pkg.dev/gke-sre-assesment/gke-apps/gke-response-service
  tag: latest
  pullPolicy: IfNotPresent
serviceAccount: {name: ""}
service: {type: ClusterIP, port: 80}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
autoscaling: {minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70}
podDisruptionBudget: {minAvailable: 1}
config: {clusterName: unknown, region: unknown, responseMessage: response-service-ready}
observability:
  enabled: false
  projectId: gke-sre-assesment
secret:
  create: false
  existingSecret: ""
  stringData: {}
secretManager:
  # Keep false for local development. Enable only on a GKE cluster with the
  # Secret Manager add-on and the matching Workload Identity access binding.
  enabled: false
  projectNumber: ""
  secretName: "gke-sre-response-demo-token"
  fileName: "response-demo-token"
  mountPath: "/var/run/secrets/gsm"
  secretProviderClassName: ""
